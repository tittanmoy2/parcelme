<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · percelme</title>
<meta name="theme-color" content="#10294A">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Fira+Code:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-area="public" data-page="ResetPassword">
<div class="flex flex-col items-center justify-center gap-7 box-border min-h-[800px] py-10 px-5 bg-slate-100 font-sans text-slate-900">
  <a class="flex items-center gap-2.5" href="Landing.html"><svg width="29" height="34" viewBox="0 0 48 56" aria-hidden="true"><circle class="fill-navy" cx="26" cy="22" r="20"></circle><rect class="fill-navy" x="6" y="22" width="11" height="32" rx="5.5"></rect><rect class="fill-accent-600" x="17" y="13" width="18" height="18" rx="3"></rect><path d="M20 13h12a3 3 0 0 1 3 3v2H17v-2a3 3 0 0 1 3-3z" fill="#9A3412"></path><rect x="24" y="13" width="4" height="18" fill="#FED7AA" opacity=".7"></rect></svg><span class="text-24 font-extrabold tracking-[-0.045em] text-navy">percel<span class="text-accent-600">me</span></span></a>
  <form class="flex flex-col gap-4.5 box-border w-full max-w-[440px] py-9 px-8 border border-solid border-slate-200 rounded-24 bg-white shadow-[0_30px_60px_-36px_rgba(15,23,42,.35)]" id="resetForm" novalidate="">
    <div><h1 class="m-0 text-26 font-extrabold tracking-[-0.02em]">Set a new password</h1><p class="mt-2 mb-0 mx-0 leading-[1.6] text-slate-600">Choose a strong password you have not used before.</p></div>
    <label class="flex flex-col gap-2 text-14 font-bold">New password
      <span class="inp"><input class="flex-1 min-w-0 border-0 bg-transparent font-sans text-16 font-medium leading-[normal] text-slate-900 outline-none" id="newPw" type="password" autocomplete="new-password" value="Shopnil@2026" aria-describedby="pwStrength"><button class="flex p-1.5 border-0 bg-transparent cursor-pointer" type="button" data-pw-toggle="newPw confirmPw" aria-label="Show password" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span>
    </label>
    <div class="flex gap-1.5" id="pwMeter" aria-hidden="true"><span class="flex-1 h-1.5 rounded-9 [transition:background_.2s] bg-green-600"></span><span class="flex-1 h-1.5 rounded-9 [transition:background_.2s] bg-green-600"></span><span class="flex-1 h-1.5 rounded-9 [transition:background_.2s] bg-green-600"></span><span class="flex-1 h-1.5 rounded-9 [transition:background_.2s] bg-green-600"></span></div>
    <span class="-mt-2 text-13 font-semibold text-green-800" id="pwStrength" aria-live="polite">Strength: strong</span>
    <div class="grid grid-cols-2 gap-2">
      <span class="flex items-center gap-2 text-13 font-semibold text-slate-500 [&amp;.ok]:text-green-800 ok" data-check="len">✓ 8+ characters</span>
      <span class="flex items-center gap-2 text-13 font-semibold text-slate-500 [&amp;.ok]:text-green-800 ok" data-check="case">✓ Upper &amp; lower case</span>
      <span class="flex items-center gap-2 text-13 font-semibold text-slate-500 [&amp;.ok]:text-green-800 ok" data-check="num">✓ A number</span>
      <span class="flex items-center gap-2 text-13 font-semibold text-slate-500 [&amp;.ok]:text-green-800 ok" data-check="sym">✓ A symbol</span>
    </div>
    <label class="flex flex-col gap-2 text-14 font-bold">Confirm password
      <span class="inp"><input class="flex-1 min-w-0 border-0 bg-transparent font-sans text-16 font-medium leading-[normal] text-slate-900 outline-none" id="confirmPw" type="password" autocomplete="new-password" value="Shopnil@2026" aria-describedby="pwMatch"></span>
    </label>
    <span class="-mt-2 text-13 font-semibold text-green-800" id="pwMatch" aria-live="polite">✓ Passwords match</span>
    <div id="resetErr" class="py-3 px-3.5 rounded-12 bg-red-100 text-left text-14 font-semibold leading-[1.5] text-red-800" role="alert" hidden=""></div>
    <button type="submit" class="btn-primary mt-1">Update password</button>
    <a class="flex items-center justify-center gap-2 text-14 font-bold text-slate-700" href="Login.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back to login</a>
  </form>
</div>
<script src="assets/core.js"></script>
<script src="assets/js/public.js"></script>


</body></html>
