/* Page-wide link rules: `a` sits in the base layer and `a:hover` skips the shared components, so the shared

body{margin:0}
@layer base{a{color:#1D4ED8;text-decoration:none}}
.rs{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #E2E8F0;border-radius:14px;font-size:14.5px;font-weight:600;cursor:pointer;background:#fff;min-height:48px;box-sizing:border-box}

.rs input{width:18px;height:18px;accent-color:#DC2626;margin:0;flex:none}
.dt{flex:1;height:44px;border:1px solid #CBD5E1;border-radius:12px;background:#fff;font:700 13.5px 'Plus Jakarta Sans',sans-serif;cursor:pointer;color:#0F172A}

.chk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;padding:10px 12px;border:1px solid #E2E8F0;border-radius:12px;cursor:pointer;min-height:44px;box-sizing:border-box}

.photo-btn{width:78px;height:64px;border:2px dashed #CBD5E1;border-radius:14px;background:#F8FAFC;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11.5px 'Plus Jakarta Sans',sans-serif;color:#475569;flex:none;overflow:hidden;position:relative;box-sizing:border-box}

.photo-btn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.err{color:#B91C1C;font-size:12.5px;font-weight:700}
